<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Vanilla Auth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login">

  <main class="card">
    <h1>🔐 Welcome back</h1>
    <p class="sub">Log in to reach the protected dashboard.</p>

    <p id="message" class="message" hidden></p>

    <form id="login-form" novalidate>
      <label>Email
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </label>

      <label>Password
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" />
      </label>

      <!-- Remember me decides WHERE the session lives:
           unchecked → sessionStorage (dies with the tab — classic session)
           checked   → localStorage  (survives closing the browser)      -->
      <label class="check">
        <input id="remember" type="checkbox" /> Remember me
      </label>

      <button type="submit">Log in</button>
    </form>

    <p class="alt">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
