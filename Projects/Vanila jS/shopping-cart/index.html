<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VanillaCart — Shopping Cart in Pure JS</title>
  <!-- Inline emoji favicon — no image file needed, and no 404 in the console -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ HEADER: brand + search + cart badge ============ -->
  <header class="header">
    <h1 class="brand">🛒 VanillaCart</h1>

    <!-- Search box: app.js listens to `input` events on this (debounced) -->
    <input id="search" class="search" type="search"
           placeholder="Search products…" autocomplete="off" />

    <!-- The badge shows total quantity in the cart; ui.js updates it -->
    <button id="cart-toggle" class="cart-toggle" aria-label="Toggle cart">
      🛍️ Cart <span id="cart-badge" class="badge">0</span>
    </button>
  </header>

  <!-- ============ FILTER / SORT CONTROLS ============ -->
  <div class="controls">
    <select id="category">
      <option value="all">All categories</option>
      <option value="electronics">Electronics</option>
      <option value="grocery">Grocery</option>
      <option value="fashion">Fashion</option>
    </select>

    <select id="sort">
      <option value="default">Sort: Featured</option>
      <option value="price-asc">Price: Low → High</option>
      <option value="price-desc">Price: High → Low</option>
      <option value="name">Name: A → Z</option>
    </select>
  </div>

  <main class="layout">
    <!-- ============ PRODUCT GRID ============
         ui.js fills this with product cards.
         ONE click listener on this element handles every
         "Add to Cart" button ever rendered (event delegation). -->
    <section id="product-grid" class="grid" aria-label="Products"></section>

    <!-- ============ CART PANEL ============
         ui.js re-renders this after every state change.
         Delegation again: one listener handles +, −, remove, clear. -->
    <aside id="cart-panel" class="cart" aria-label="Shopping cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>

      <!-- Coupon form: submit event, e.preventDefault() in app.js -->
      <form id="coupon-form" class="coupon">
        <input id="coupon-input" placeholder="Coupon code (try SAVE10)" />
        <button type="submit">Apply</button>
      </form>

      <div id="cart-summary" class="summary"></div>

      <button id="clear-cart" class="danger">Clear cart</button>
    </aside>
  </main>

  <!-- Toast notifications appear here (ui.js creates/removes them) -->
  <div id="toast-zone" class="toast-zone" aria-live="polite"></div>

  <!-- type="module" turns on import/export between our JS files.
       app.js is the ONLY entry point — it imports everything else. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
